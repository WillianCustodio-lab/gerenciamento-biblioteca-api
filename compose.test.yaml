name: biblioteca-tests

services:
  db-test:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: biblioteca_test
      POSTGRES_USER: biblioteca_test
      POSTGRES_PASSWORD: test-only-password

    ports:
      - "127.0.0.1:5434:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca_test -d biblioteca_test"]
      interval: 2s
      timeout: 5s
      retries: 15